name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew :core:jvmTest :app:assembleDebug --console=plain
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk petpulse-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: petpulse-debug-apk
          path: petpulse-debug.apk
      # Every build of main becomes a GitHub release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/petpulse-debug.apk
      - name: Publish test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android test build ${{ github.run_number }}
          body: Debug build for testing. On your phone, open this page, download petpulse-debug.apk and allow installs from this source.
          files: petpulse-debug.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for simulator (no signing)
        run: |
          cd ios
          xcodebuild -project PetPulse.xcodeproj -scheme PetPulse -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
