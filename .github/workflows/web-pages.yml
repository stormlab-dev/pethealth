name: Publish web app

# Publishes web/ (the CuteFamilyPet website plus the web app at /app/) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Custom domain: set Settings → Pages → Custom domain to www.cutefamilypet.com, point DNS at GitHub
# (see docs/WEBSITE.md), then add a repository variable CUSTOM_DOMAIN=www.cutefamilypet.com so the
# site is built for the domain root instead of https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: web
        env:
          VITE_BASE: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          # Optional: add these as repository variables to sync with Supabase instead of demo mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
