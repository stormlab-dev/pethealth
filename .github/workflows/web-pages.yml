name: Publish web app

# Publishes web/ (the CuteFamilyPet website plus the web app at /app/) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Custom domain: set Settings → Pages → Custom domain to www.cutefamilypet.com, point DNS at GitHub
# (see docs/WEBSITE.md), then re-run this workflow; it picks up the domain automatically.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout) so the uploaded site
  # artifact is registered before deploy-pages looks for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reports where Pages serves the site: "/pethealth" on github.io, "" once a custom domain is set.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: web
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional: add these as repository variables to sync with Supabase instead of demo mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
