# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen && open PetPulse.xcodeproj
name: PetPulse
options:
  bundleIdPrefix: com.cutefamilypet
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""   # set your Apple team id to run on a device
targets:
  PetPulse:
    type: application
    platform: iOS
    scheme: {}
    sources: [PetPulse]
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: PetPulse/Info.plist
      properties:
        CFBundleDisplayName: CuteFamilyPet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Optional cloud settings (AI symptom checks). Set CFP_SUPABASE_URL and CFP_SUPABASE_ANON_KEY
        # in the build settings or an xcconfig; empty keeps the app offline.
        CFPSupabaseURL: $(CFP_SUPABASE_URL)
        CFPSupabaseAnonKey: $(CFP_SUPABASE_ANON_KEY)
        # AdMob (free plan only). Defaults are Google's public test ids; set real ones for release.
        GADApplicationIdentifier: $(CFP_ADMOB_APP_ID)
        CFPAdMobBannerID: $(CFP_ADMOB_BANNER_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cutefamilypet.app
        CFP_SUPABASE_URL: ""
        CFP_SUPABASE_ANON_KEY: ""
        CFP_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        CFP_ADMOB_BANNER_ID: ca-app-pub-3940256099942544/2435281174
        # Shared Kotlin core, built by the script below into core/build/xcode-frameworks.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "PetPulseCore"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build shared Kotlin core
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode
