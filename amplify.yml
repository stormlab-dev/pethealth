# AWS Amplify Hosting build settings for the CuteFamilyPet website (web/).
# In the Amplify console, connect this repo's main branch, tick "My app is a monorepo" and enter
# web as the root directory (that sets AMPLIFY_MONOREPO_APP_ROOT=web). See docs/WEBSITE.md.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            - npm test
            # Built for the domain root. Optional cloud keys: add VITE_SUPABASE_URL and
            # VITE_SUPABASE_ANON_KEY under Amplify → Hosting → Environment variables.
            - VITE_BASE=/ npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
